# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# Keep resource IDs final for legacy Java switch statements.
android.nonFinalResIds=false

# The project still uses legacy Support libraries while newer Google
# Play services transitively include AndroidX. Jetifier bridges the two.
android.useAndroidX=true
android.enableJetifier=true
