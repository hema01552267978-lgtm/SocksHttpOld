name: Android Build and Startup Test

on:
  push:
    branches: [ main, master, fix-bcrypt-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-smoke-test:
    name: Build and launch on Android ${{ matrix.api-level }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api-level: [35, 36]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Launch app on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: google_apis
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot -wipe-data
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 600
          script: |
            set -eu
            APK="app/build/outputs/apk/debug/app-debug.apk"
            PACKAGE="com.slipkprojects.sockshttp"
            adb install -r "$APK"
            adb logcat -c
            adb shell am force-stop "$PACKAGE"
            adb shell am start -W -n "$PACKAGE/.LauncherActivity"
            sleep 25
            adb logcat -d -v threadtime > emulator-logcat.txt
            if ! adb shell pidof "$PACKAGE" >/dev/null 2>&1; then
              echo "FAIL: app process is not running after launch."
              tail -n 250 emulator-logcat.txt
              exit 1
            fi
            adb shell run-as "$PACKAGE" cat files/startup_stage.txt > startup-stage.txt
            if ! grep -q "MAIN_READY: main screen initialized" startup-stage.txt; then
              echo "FAIL: main screen did not reach MAIN_READY."
              cat startup-stage.txt
              tail -n 250 emulator-logcat.txt
              exit 1
            fi
            if grep -A 8 -B 2 "FATAL EXCEPTION" emulator-logcat.txt | grep -q "$PACKAGE"; then
              echo "FAIL: fatal exception from the app detected."
              tail -n 250 emulator-logcat.txt
              exit 1
            fi
            echo "PASS: main screen reached MAIN_READY and stayed alive for 25 seconds on API ${{ matrix.api-level }}."

      - name: Upload emulator log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-log-API-${{ matrix.api-level }}
          path: |
            emulator-logcat.txt
            startup-stage.txt
          if-no-files-found: ignore

      - name: Publish APK only after startup test passes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Elmaloo3n-VPN-API-${{ matrix.api-level }}
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
