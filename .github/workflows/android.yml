name: Android CI
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Fix All - Correct Order
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          # 1. Gradle + AGP
          p = Path("gradle/wrapper/gradle-wrapper.properties")
          if p.exists():
              t = p.read_text()
              t = re.sub(r'gradle-[\d.]+-(all|bin)\.zip', 'gradle-8.7-all.zip', t)
              p.write_text(t)

          p = Path("build.gradle")
          if p.exists():
              t = p.read_text()
              t = re.sub(r"com\.android\.tools\.build:gradle:[0-9.]+", "com.android.tools.build:gradle:8.5.2", t)
              p.write_text(t)

          # 2. اهم خطوة: اقرا package من كل Manifest قبل ما تمسحه
          pkg_map = {}  # folder -> package
          for m in list(Path(".").rglob("AndroidManifest.xml")):
              if ".git" in str(m) or "/build/" in str(m): continue
              try: txt = m.read_text()
              except: continue
              mm = re.search(r'package="([^"]+)"', txt)
              if mm:
                  # المجلد اللي فيه الـ Manifest ده، اطلع لفوق لحد build.gradle
                  folder = m.parent.parent.parent  # src/main -> module root تقريبا
                  # دور على اقرب build.gradle لفوق
                  cur = m.parent
                  for _ in range(5):
                      if (cur / "build.gradle").exists():
                          pkg_map[str(cur)] = mm.group(1)
                          break
                      cur = cur.parent
                  print(f"found package {mm.group(1)} for {cur}")

          print("pkg_map:", pkg_map)

          # 3. حط namespace في كل build.gradle
          for p in list(Path(".").rglob("build.gradle")):
              if ".git" in str(p) or "/build/" in str(p): continue
              try: t = p.read_text()
              except: continue
              orig = t
              t = re.sub(r'compileSdk\s+\d+', 'compileSdk 35', t)
              t = re.sub(r'targetSdk\s+\d+', 'targetSdk 35', t)
              t = re.sub(r'minSdk\s+\d+', 'minSdk 24', t)
              t = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 24', t)

              if 'namespace' not in t and ('com.android.application' in t or 'com.android.library' in t):
                  # اولوية 1: package من الـ Manifest بتاع نفس الموديول
                  ns = pkg_map.get(str(p.parent))
                  # اولوية 2: applicationId
                  if not ns:
                      m2 = re.search(r'applicationId\s+["\']([^"\']+)["\']', t)
                      if m2: ns = m2.group(1)
                  # اولوية 3: اسم المجلد كـ fallback عشان مايقعش تاني
                  if not ns:
                      ns = f"com.sockshttp.{p.parent.name.replace('-','_').replace(' ','_')}"
                  # حطه بعد android {
                  t = re.sub(r'android\s*\{', f'android {{\n    namespace "{ns}"', t, count=1)
                  print(f"added namespace {ns} to {p}")

              if 'ndkVersion' not in t and 'compileSdk 35' in t:
                  t = t.replace('compileSdk 35', 'compileSdk 35\n    ndkVersion "27.0.12077973"', 1)
              if t != orig: p.write_text(t)

          # 4. دلوقتي بس امسح package من الـ Manifests
          for m in list(Path(".").rglob("AndroidManifest.xml")):
              if ".git" in str(m) or "/build/" in str(m): continue
              try: t = m.read_text()
              except: continue
              if 'xmlns:tools' not in t:
                  t = t.replace('<manifest', '<manifest xmlns:tools="http://schemas.android.com/tools"', 1)
              t = re.sub(r'\s+package="[^"]+"', '', t)
              if 'app/src/main' not in str(m):
                  # مكتبة: امسح application بتاعها عشان مايتخانقش
                  t = re.sub(r'<application[^>]*>.*?</application>', '', t, flags=re.S)
                  t = re.sub(r'<application[^>]*/>', '', t)
              else:
                  if '<application' in t and 'tools:replace' not in t:
                      t = t.replace('<application', '<application tools:replace="android:label,android:icon,android:theme,android:allowBackup,android:supportsRtl,android:usesCleartextTraffic"', 1)
                  t = re.sub(r'<uses-sdk[^>]*/>', '', t)
              m.write_text(t)
          print("ALL FIXED OK")
          PY

      - name: Restore Layouts
        run: |
          FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD)
          git checkout "$FIRST_COMMIT" -- app/src/main/res/layout/activity_main.xml app/src/main/res/layout/activity_main_drawer.xml || true

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --info || true
          echo "===== MERGER REPORT ====="
          find . -name "manifest-merger-*-report.txt" -exec echo "--- {} ---" \; -exec cat {} \; || true
          echo "===== FIND APK ====="
          find . -name "*.apk" || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Elmaloo3n-VPN-APK
          path: app/build/outputs/apk/debug/*.apk
