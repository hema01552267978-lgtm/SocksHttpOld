name: Android CI

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Fix All Old Project Problems For Android 16
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          # 1. تحديث Gradle من 6.5 لـ 8.7
          try:
              p = Path("gradle/wrapper/gradle-wrapper.properties")
              t = p.read_text()
              t = re.sub(r'gradle-.*\.zip', 'gradle-8.7-all.zip', t)
              p.write_text(t)
              print("Gradle -> 8.7 OK")
          except Exception as e:
              print(f"Gradle wrapper skip: {e}")

          # 2. تحديث ملف build.gradle الرئيسي
          try:
              p = Path("build.gradle")
              t = p.read_text()
              # حذف jcenter القديم
              t = t.replace("jcenter()", "mavenCentral()")
              # تحديث Android Gradle Plugin لاي نسخة قديمة
              t = re.sub(r"com\.android\.tools\.build:gradle:[0-9\.]+", "com.android.tools.build:gradle:8.5.2", t)
              # لو مفيش AGP خالص، نسيبه زي ما هو
              # اضافة مستودع jenkins لو مش موجود
              if "repo.jenkins-ci.org" not in t:
                  t = t.replace("mavenCentral()", "mavenCentral()\n        maven { url 'https://repo.jenkins-ci.org/public/' }")
              p.write_text(t)
              print("Root build.gradle OK")
          except Exception as e:
              print(f"Root build.gradle skip: {e}")

          # 3. تحديث gradle.properties
          try:
              p = Path("gradle.properties")
              t = p.read_text() if p.exists() else ""
              if "android.useAndroidX" not in t:
                  t += "\nandroid.useAndroidX=true\nandroid.enableJetifier=true\n"
              if "android.nonTransitiveRClass" not in t:
                  t += "android.nonTransitiveRClass=true\n"
              t = t.replace("org.gradle.jvmargs=-Xmx1536m", "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8")
              if "org.gradle.jvmargs" not in t:
                  t += "org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8\n"
              p.write_text(t)
              print("gradle.properties OK")
          except Exception as e:
              print(f"gradle.properties skip: {e}")

          # 4. تحديث app/build.gradle - اهم جزء
          try:
              p = Path("app/build.gradle")
              if not p.exists():
                  # جرب .kts
                  p = Path("app/build.gradle.kts")
              t = p.read_text()
              # compileSdk و targetSdk
              t = re.sub(r'compileSdk\s+\d+', 'compileSdk 35', t)
              t = re.sub(r'compileSdkVersion\s+\d+', 'compileSdk 35', t)
              t = re.sub(r'targetSdk\s+\d+', 'targetSdk 35', t)
              t = re.sub(r'targetSdkVersion\s+\d+', 'targetSdk 35', t)
              t = re.sub(r'minSdk\s+1[0-9]', 'minSdk 24', t)
              t = re.sub(r'minSdkVersion\s+1[0-9]', 'minSdk 24', t)
              # NDK لدعم 16KB
              if 'ndkVersion' not in t:
                  t = t.replace('compileSdk 35', 'compileSdk 35\n    ndkVersion "27.0.12077973"')
              # namespace مطلوب في AGP 8
              if 'namespace' not in t:
                  # حاول تجيب applicationId
                  m = re.search(r'applicationId\s+"([^"]+)"', t)
                  ns = m.group(1) if m else "com.sockhttp.app"
                  # حطه بعد android {
                  t = re.sub(r'android\s*\{', f'android {{\n    namespace "{ns}"', t, count=1)
              # packaging لدعم 16KB
              if 'useLegacyPackaging' not in t:
                  if 'packagingOptions' in t:
                      t = t.replace('packagingOptions {', 'packagingOptions {\n        jniLibs {\n            useLegacyPackaging = false\n        }', 1)
                  else:
                      t = t.replace('buildTypes {', 'packagingOptions {\n        jniLibs {\n            useLegacyPackaging = false\n        }\n    }\n    buildTypes {', 1)
              p.write_text(t)
              print("app/build.gradle OK")
          except Exception as e:
              print(f"app/build.gradle skip: {e}")

          # 5. تعديل AndroidManifest لاندرويد 14 و 16
          try:
              p = Path("app/src/main/AndroidManifest.xml")
              t = p.read_text()
              # اضافة foregroundServiceType لو مش موجود
              if 'foregroundServiceType' not in t:
                  t = t.replace('android:name=".MainService"', 'android:name=".MainService" android:foregroundServiceType="dataSync|connectedDevice"')
                  t = t.replace('android:name=".VpnService"', 'android:name=".VpnService" android:foregroundServiceType="dataSync|connectedDevice"')
              p.write_text(t)
              print("Manifest OK")
          except Exception as e:
              print(f"Manifest skip: {e}")
          PY

      - name: Fix Layouts And Branding
        run: |
          FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD)
          git checkout "$FIRST_COMMIT" -- app/src/main/res/layout/activity_main.xml app/src/main/res/layout/activity_main_drawer.xml || echo "layout restore skip"
          python3 - <<'PY'
          import re
          from pathlib import Path
          try:
              layout_dir = Path("app/src/main/res/layout")
              for path in layout_dir.glob("*main*.xml"):
                  xml = path.read_text()
                  xml = re.sub(r'android:background="@color/[^"]+"', 'android:background="@drawable/my_photo"', xml)
                  path.write_text(xml)
              path = layout_dir / "activity_main.xml"
              xml = path.read_text()
              if "tv_marquee" not in xml:
                  header = """<LinearLayout
                      android:layout_width="match_parent"
                      android:layout_height="wrap_content"
                      android:orientation="vertical"
                      android:background="#CC000000"
                      android:padding="8dp"
                      android:gravity="center">
                      <TextView
                          android:id="@+id/tv_marquee"
                          android:layout_width="match_parent"
                          android:layout_height="wrap_content"
                          android:text="Welcome to Elmaloo3n"
                          android:textColor="#FF1744"
                          android:textSize="16sp"
                          android:textStyle="bold"
                          android:singleLine="true"
                          android:ellipsize="marquee"
                          android:marqueeRepeatLimit="marquee_forever"
                          android:focusable="true"
                          android:focusableInTouchMode="true" />
                      <Button
                          android:id="@+id/btn_wa_dev"
                          android:layout_width="match_parent"
                          android:layout_height="40dp"
                          android:layout_marginTop="6dp"
                          android:text="Contact Developer WhatsApp"
                          android:backgroundTint="#25D366"
                          android:textColor="#FFFFFF" />
                  </LinearLayout>
                  """
                  root = re.search(r'<ScrollView\b[^>]*>', xml, re.S)
                  if root:
                      content = xml[root.end():]
                      child = re.search(r'<LinearLayout\b[^>]*>', content, re.S)
                      if child:
                          position = root.end() + child.end()
                          xml = xml[:position] + "\n" + header + xml[position:]
                          path.write_text(xml)
              print("Layout OK")
          except Exception as e:
              print(f"Layout skip: {e}")
          PY

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elmaloo3n-VPN-APK
          path: app/build/outputs/apk/debug/*.apk
