name: Android CI # Native launcher diagnostics build
on:
  push:
    branches: [ main, master, fix-bcrypt-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      # Keep the app's declared minSdk/targetSdk unchanged.
      # Only align the build tools with the existing Android Gradle files.
      - name: Prepare build tools
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          wrapper = Path("gradle/wrapper/gradle-wrapper.properties")
          if wrapper.exists():
              text = wrapper.read_text()
              text = re.sub(r'gradle-[0-9.]+-(all|bin)\.zip', 'gradle-8.7-all.zip', text)
              wrapper.write_text(text)

          root = Path("build.gradle")
          if root.exists():
              text = root.read_text()
              text = re.sub(r'com\.android\.tools\.build:gradle:[0-9.]+', 'com.android.tools.build:gradle:8.6.1', text)
              root.write_text(text)
          PY

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Elmaloo3n-VPN-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
