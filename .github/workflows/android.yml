name: Android CI
on:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Prepare project - fix everything
        run: |
          python3 - <<'PY'
          import re, pathlib
          # 1. Gradle 6.5 -> 8.7
          p = pathlib.Path("gradle/wrapper/gradle-wrapper.properties")
          if p.exists():
              t = p.read_text()
              t = re.sub(r'gradle-[\d.]+-(all|bin)\.zip', 'gradle-8.7-all.zip', t)
              p.write_text(t)

          # 2. AGP -> 8.5.2
          p = pathlib.Path("build.gradle")
          if p.exists():
              t = p.read_text()
              t = re.sub(r"com\.android\.tools\.build:gradle:[^'\"]+", "com.android.tools.build:gradle:8.5.2", t)
              if "mavenCentral()" in t and "jenkins" not in t:
                  t = t.replace("mavenCentral()", "mavenCentral()\n        maven { url 'https://repo.jenkins-ci.org/public/' }")
              p.write_text(t)

          # 3. Fix all build.gradle + build.gradle.kts
          for p in list(pathlib.Path(".").rglob("build.gradle")) + list(pathlib.Path(".").rglob("build.gradle.kts")):
              if ".git" in str(p): continue
              try: t = p.read_text()
              except: continue
              orig = t
              t = re.sub(r'compileSdk\s*=?\s*\d+', 'compileSdk 35', t)
              t = re.sub(r'targetSdk\s*=?\s*\d+', 'targetSdk 35', t)
              t = re.sub(r'minSdk\s*=?\s*\d+', 'minSdk 24', t)
              t = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 35', t)
              t = re.sub(r'targetSdkVersion\s+\d+', 'targetSdkVersion 35', t)
              t = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 24', t)
              # namespace - اهم حاجة في AGP 8
              if "namespace" not in t:
                  m = re.search(r'applicationId\s*["\']([^"\']+)["\']', t)
                  if m:
                      ns = m.group(1)
                      t = t.replace("android {", f"android {{\n    namespace '{ns}'", 1)
                  elif "com.android.library" in t:
                      # مكتبة من غير namespace - خدها من الـ Manifest
                      pass
              if t != orig:
                  p.write_text(t)
                  print(f"fixed {p}")

          # 4. Fix ALL AndroidManifest.xml - ده حل مشكلة merger
          for p in pathlib.Path(".").rglob("AndroidManifest.xml"):
              if ".git" in str(p) or "/build/" in str(p): continue
              try: t = p.read_text()
              except: continue
              orig = t
              # ضيف xmlns:tools لو مش موجود
              if "xmlns:tools" not in t:
                  t = t.replace("<manifest", '<manifest xmlns:tools="http://schemas.android.com/tools"', 1)
              # شيل package من الـ Manifest لان بقى في namespace
              t = re.sub(r'\s+package="[^"]+"', '', t)
              # شيل uses-sdk القديم اللي بيعمل تضارب
              t = re.sub(r'<uses-sdk[^>]*/>', '', t)
              t = re.sub(r'<uses-sdk[^>]*>.*?</uses-sdk>', '', t, flags=re.S)
              # لو دي مكتبة - شيل اي application attributes بتعمل تضارب
              is_app = str(p) == "app/src/main/AndroidManifest.xml"
              if not is_app:
                  # في المكتبات: خلي الـ application فاضي
                  t = re.sub(r'<application[^>]*>', '<application>', t, count=1)
              else:
                  # في التطبيق الرئيسي: ضيف tools:replace عشان يغلب اي مكتبة
                  if "tools:replace" not in t:
                      t = re.sub(r'<application', '<application\n        tools:replace="android:label,android:icon,android:theme,android:allowBackup,android:supportsRtl,android:name"', t, count=1)
                  # شيل اي applicationId او theme مكرر
              if t != orig:
                  p.write_text(t)
                  print(f"fixed manifest {p}")

          # 5. gradle.properties
          p = pathlib.Path("gradle.properties")
          t = p.read_text() if p.exists() else ""
          for line in ["android.useAndroidX=true", "android.enableJetifier=true", "android.nonTransitiveRClass=true"]:
              if line.split("=")[0] not in t:
                  t += "\n" + line + "\n"
          p.write_text(t)
          print("DONE PREPARE")
          PY

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace || true
          echo "===== MERGER REPORT ====="
          find . -name "manifest-merger-*-report.txt" -exec echo "--- {} ---" \; -exec cat {} \; || true
          echo "===== FIND APK ====="
          find app/build -name "*.apk" || true
          # لو البناء نجح فعلا، نخرج 0، لو فشل نخرج 1 عشان نشوف التقرير
          ls app/build/outputs/apk/debug/*.apk

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Elmaloo3n-VPN-APK
          path: app/build/outputs/apk/debug/*.apk
