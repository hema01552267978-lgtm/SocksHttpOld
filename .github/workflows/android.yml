name: Android CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - run: |
          sed -i 's/org.connectbot.jbcrypt:jbcrypt:1.0.0/org.mindrot:jbcrypt:0.4/g' service/build.gradle
          sed -i '/repo.spring.io/d' build.gradle
          find service/src -name "*.java" -exec sed -i 's/org.connectbot.jbcrypt.BCrypt/org.mindrot.jbcrypt.BCrypt/g' {} +
          chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Elmaloo3n-VPN-APK
          path: app/build/outputs/apk/debug/*.apk
