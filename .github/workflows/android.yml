name: Android CI
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
      - name: Fix All - Bulletproof
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          def fix_gradle(p):
              try: t = p.read_text()
              except: return
              orig = t
              t = re.sub(r'compileSdk\s+\d+', 'compileSdk 35', t)
              t = re.sub(r'targetSdk\s+\d+', 'targetSdk 35', t)
              t = re.sub(r'minSdk\s+\d+', 'minSdk 24', t)
              t = re.sub(r'minSdkVersion\s+\d+', 'minSdkVersion 24', t)
              t = re.sub(r'\s*buildToolsVersion\s+["\'][^"\']+["\']', '', t)
              # jbcrypt الميتة
              t = re.sub(r"org\.connectbot\.jbcrypt:jbcrypt:[^\s\"']+", "org.mindrot:jbcrypt:0.4", t)
              t = re.sub(r"com\.github\.connectbot:jbcrypt:[^\s\"']+", "org.mindrot:jbcrypt:0.4", t)
              t = re.sub(r"org\.connectbot\.jbcrypt:jbcrypt", "org.mindrot:jbcrypt:0.4", t)
              # JitPack
              if "jitpack.io" not in t and "repositories" in t:
                  t = t.replace("mavenCentral()", "mavenCentral()\n        maven { url 'https://jitpack.io' }")
              # اقفل Lint + حط Java 17 + packaging
              if 'lintOptions' not in t and 'lint {' not in t and 'compileSdk' in t:
                  t = t.replace('compileSdk 35', 'compileSdk 35\n    ndkVersion "27.0.12077973"\n    lint { abortOnError false; checkReleaseBuilds false; disable "MissingTranslation", "ExtraTranslation", "InvalidPackage" }\n    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }\n    packaging { resources { excludes += ["META-INF/*", "META-INF/DEPENDENCIES", "META-INF/LICENSE*", "META-INF/NOTICE*"] } }', 1)
              if t != orig: p.write_text(t)

          # 1. Wrapper + AGP
          p = Path("gradle/wrapper/gradle-wrapper.properties")
          if p.exists():
              t = p.read_text()
              t = re.sub(r'gradle-[\d.]+-(all|bin)\.zip', 'gradle-8.7-all.zip', t)
              p.write_text(t)
          p = Path("build.gradle")
          if p.exists():
              t = p.read_text()
              t = re.sub(r"com\.android\.tools\.build:gradle:[0-9.]+", "com.android.tools.build:gradle:8.5.2", t)
              if "jitpack.io" not in t:
                  t = t.replace("mavenCentral()", "mavenCentral()\n        maven { url 'https://jitpack.io' }\n        maven { url 'https://repo.jenkins-ci.org/public/' }")
              p.write_text(t)

          # 2. Package map
          pkg_map = {}
          for m in list(Path(".").rglob("AndroidManifest.xml")):
              if ".git" in str(m) or "/build/" in str(m): continue
              try: txt = m.read_text()
              except: continue
              mm = re.search(r'package="([^"]+)"', txt)
              if mm:
                  cur = m.parent
                  for _ in range(6):
                      if (cur / "build.gradle").exists():
                          pkg_map[str(cur)] = mm.group(1); break
                      cur = cur.parent

          # 3. كل build.gradle
          for p in list(Path(".").rglob("build.gradle")):
              if ".git" in str(p) or "/build/" in str(p): continue
              fix_gradle(p)
              try: t = p.read_text()
              except: continue
              if 'namespace' not in t and ('com.android.application' in t or 'com.android.library' in t):
                  ns = pkg_map.get(str(p.parent))
                  if not ns:
                      m2 = re.search(r'applicationId\s+["\']([^"\']+)["\']', t)
                      if m2: ns = m2.group(1)
                  if not ns: ns = f"com.sockshttp.{p.parent.name.replace('-','_')}"
                  t = re.sub(r'android\s*\{', f'android {{\n    namespace "{ns}"', t, count=1)
                  p.write_text(t)

          # 4. اصلاح imports
          for ext in ["*.java", "*.kt"]:
              for f in list(Path(".").rglob(ext)):
                  if ".git" in str(f) or "/build/" in str(f): continue
                  try: txt = f.read_text(errors="ignore")
                  except: continue
                  if "org.connectbot.jbcrypt" in txt:
                      f.write_text(txt.replace("org.connectbot.jbcrypt", "org.mindrot.jbcrypt"))

          # 5. Manifest - الحل النهائي
          for m in list(Path(".").rglob("AndroidManifest.xml")):
              if ".git" in str(m) or "/build/" in str(m): continue
              try: t = m.read_text()
              except: continue
              if 'xmlns:tools' not in t:
                  t = t.replace('<manifest', '<manifest xmlns:tools="http://schemas.android.com/tools"', 1)
              t = re.sub(r'\s+package="[^"]+"', '', t)
              if 'app/src/main' not in str(m):
                  t = re.sub(r'<application[^>]*>.*?</application>', '', t, flags=re.S)
                  t = re.sub(r'<application[^>]*/>', '', t)
                  t = re.sub(r'<uses-sdk[^>]*/>', '', t)
              else:
                  t = re.sub(r'\s+tools:replace="[^"]+"', '', t)
                  # شيل الاذونات المكررة كلها، مش INTERNET بس
                  seen = set()
                  out = []
                  for line in t.splitlines():
                      mm2 = re.search(r'uses-permission[^>]*android:name="([^"]+)"', line)
                      if mm2:
                          if mm2.group(1) in seen: continue
                          seen.add(mm2.group(1))
                      out.append(line)
                  t = "\n".join(out)
                  # حط القيم الحقيقية
                  if 'android:supportsRtl' not in t:
                      t = t.replace('<application', '<application android:supportsRtl="true"', 1)
                  if 'android:usesCleartextTraffic' not in t:
                      t = t.replace('<application', '<application android:usesCleartextTraffic="true"', 1)
                  if 'android:allowBackup' not in t:
                      t = t.replace('<application', '<application android:allowBackup="true"', 1)
                  if 'tools:replace' not in t:
                      t = t.replace('<application', '<application tools:replace="android:label,android:icon,android:theme"', 1)
                  t = re.sub(r'<uses-sdk[^>]*/>', '', t)
              m.write_text(t)
          print("BULLETPROOF FIX DONE")
          PY
      - name: Restore Layouts
        run: |
          FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD)
          git checkout "$FIRST_COMMIT" -- app/src/main/res/layout/activity_main.xml app/src/main/res/layout/activity_main_drawer.xml || true
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew clean || true
          ./gradlew assembleDebug --stacktrace --continue > build.log 2>&1 || true
          echo "========== REAL ERROR =========="
          grep -i -m 30 -E "error:|Caused by:|FAILED|Execution failed" build.log || echo "NO ERROR FOUND - CHECK APK"
          echo "========== APK =========="
          find . -name "*.apk" -type f || true
          echo "========== TAIL =========="
          tail -n 40 build.log
      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Elmaloo3n-VPN-APK
          path: |
            **/*.apk
            build.log
          if-no-files-found: warn
