name: Android CI

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'

      - name: Prepare project
        run: |
          FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD)

          git checkout $FIRST_COMMIT -- app/src/main/res/layout/activity_main.xml app/src/main/res/layout/activity_main_drawer.xml

          python3 <<'PY'
          from pathlib import Path

          path = Path("build.gradle")
          text = path.read_text()

          repo = "maven { url 'https://repo.jenkins-ci.org/public/' }"

          if repo not in text:
              text = text.replace(
                  "mavenCentral()",
                  "mavenCentral()\n        " + repo
              )

          path.write_text(text)
          PY

          python3 <<'PY'
          import re
          from pathlib import Path

          layout_dir = Path("app/src/main/res/layout")

          for path in layout_dir.glob("*main*.xml"):
              xml = path.read_text()
              xml = re.sub(
                  r'android:background="@color/[^"]+"',
                  'android:background="@drawable/my_photo"',
                  xml
              )
              path.write_text(xml)

          path = layout_dir / "activity_main.xml"
          xml = path.read_text()

          header = """<LinearLayout
              android:layout_width="match_parent"
              android:layout_height="wrap_content"
              android:orientation="vertical"
              android:background="#CC000000"
              android:padding="8dp"
              android:gravity="center">

              <TextView
                  android:id="@+id/tv_marquee"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="🔥 مرحباً بكم في تطبيق ✹⃝𝑰🇵🇸⃝𝑬𝑳M𝑨𝑳oo3n✯ الرسمي 🔥"
                  android:textColor="#FF1744"
                  android:textSize="16sp"
                  android:textStyle="bold"
                  android:singleLine="true"
                  android:ellipsize="marquee"
                  android:marqueeRepeatLimit="marquee_forever"
                  android:focusable="true"
                  android:focusableInTouchMode="true" />

              <Button
                  android:id="@+id/btn_wa_dev"
                  android:layout_width="match_parent"
                  android:layout_height="40dp"
                  android:layout_marginTop="6dp"
                  android:text="تواصل مع المطور واتساب (01552267978)"
                  android:backgroundTint="#25D366"
                  android:textColor="#FFFFFF" />

          </LinearLayout>
          """

          root = re.search(r'<ScrollView\b[^>]*>', xml, re.S)

          if not root:
              raise Exception("ScrollView root not found")

          content = xml[root.end():]
          child = re.search(r'<LinearLayout\b[^>]*>', content, re.S)

          if not child:
              raise Exception("Main LinearLayout not found")

          position = root.end() + child.end()

          xml = xml[:position] + "\n" + header + xml[position:]

          path.write_text(xml)

          print("Layout updated successfully")
          PY

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Elmaloo3n-VPN-APK
          path: app/build/outputs/apk/debug/*.apk          path: app/build/outputs/apk/debug/*.apk
