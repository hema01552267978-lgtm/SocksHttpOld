name: Android CI
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - run: |
          FIRST_COMMIT=$(git rev-list --max-parents=0 HEAD)
          git checkout $FIRST_COMMIT -- app/src/main/res/layout/activity_main.xml app/src/main/res/layout/activity_main_drawer.xml
          sed -i 's/org.connectbot.jbcrypt:jbcrypt:1.0.0/org.mindrot:jbcrypt:0.4/g' service/build.gradle
          sed -i '/repo.spring.io/d' build.gradle
          find service/src -name "*.java" -exec sed -i 's/org.connectbot.jbcrypt.BCrypt/org.mindrot.jbcrypt.BCrypt/g' {} +
          python3 -c '
          import glob, re
          for l in glob.glob("app/src/main/res/layout/*main*.xml"):
              xml = open(l).read()
              xml = re.sub(r"android:background=\"@color/[^\"]+\"", "android:background=\"@drawable/my_photo\"", xml)
              header = """<LinearLayout android:layout_width="match_parent" android:layout_height="wrap_content" android:orientation="vertical" android:background="#CC000000" android:padding="8dp" android:gravity="center"><TextView android:id="@+id/tv_marquee" android:layout_width="match_parent" android:layout_height="wrap_content" android:text="🔥 مرحباً بكم في تطبيق ✹⃝𝑰🇵🇸⃝𝑬𝑳M𝑨𝑳oo3n✯ الرسمي 🔥" android:textColor="#FF1744" android:textSize="16sp" android:textStyle="bold" android:singleLine="true" android:ellipsize="marquee" android:marqueeRepeatLimit="marquee_forever" android:focusable="true" android:focusableInTouchMode="true"/><Button android:id="@+id/btn_wa_dev" android:layout_width="match_parent" android:layout_height="40dp" android:layout_marginTop="6dp" android:text="تواصل مع المطور واتساب (01552267978)" android:backgroundTint="#25D366" android:textColor="#FFFFFF"/></LinearLayout>"""
              xml = xml.replace("<ScrollView", header + "\n<ScrollView", 1)
              open(l, "w").write(xml)
          '
          chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Elmaloo3n-VPN-APK
          path: app/build/outputs/apk/debug/*.apk
