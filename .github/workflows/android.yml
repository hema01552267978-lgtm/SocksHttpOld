name: Android Compile Check (Not a Release)

on:
  push:
    branches: [fix-bcrypt-build, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin

      - name: Compile debug APK (verification only)
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug --stacktrace
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK for testing (not a release)
        uses: actions/upload-artifact@v4
        with:
          name: SocksHttpOld-debug-test
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
