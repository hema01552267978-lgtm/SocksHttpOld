plugins {
    id 'com.android.application'
}

android {
    namespace 'com.slipkprojects.sockshttp'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    packaging {
        resources {
            excludes += ['META-INF/androidx.legacy_legacy-support-core-utils.version']
        }
    }

    defaultConfig {
        applicationId 'com.slipkprojects.sockshttp'
        minSdk 21
        targetSdk 28
        versionCode 25
        versionName '1.1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.android.support:appcompat-v7:28.0.0'
    implementation 'com.android.support:preference-v7:28.0.0'
    implementation 'com.android.support:design:28.0.0'
    implementation 'com.android.support.constraint:constraint-layout:1.1.3'
    implementation 'com.google.android.gms:play-services-ads-lite:18.3.0'
    implementation project(':service')
}
