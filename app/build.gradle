plugins {
    id 'com.android.application'
}

android {
    namespace 'com.slipkprojects.sockshttp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.slipkprojects.sockshttp'
        minSdk 21
        targetSdk 28
        versionCode 25
        versionName '1.1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.android.support:appcompat-v7:25.+'
    implementation 'com.android.support:preference-v7:25.+'
    implementation 'com.android.support:design:25.+'
    implementation 'com.android.support.constraint:constraint-layout:1.0.2'
    implementation 'com.google.android.gms:play-services-ads-lite:11.8.0'
    implementation project(':service')
}
